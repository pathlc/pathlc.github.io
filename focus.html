<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Informacja</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 720px;
      padding: 32px;
      text-align: center;
    }

    .message {
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      line-height: 1.35;
      font-weight: 600;
      margin-bottom: 40px;
    }

    .rules {
      display: inline-block;
      text-align: left;
      font-size: clamp(1.2rem, 2.4vw, 1.7rem);
      line-height: 1.7;
      font-weight: 500;
    }

    .muted {
      margin-top: 40px;
      color: #6b7280;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="message">
      Za tymi drzwiami, do godziny 10:00 trwa eksperyment naukowy polegający na sprawdzeniu,
      czy patomorfolog jest w stanie pracować w skupieniu dłużej niż 7 minut.
    </div>

    <div class="rules">
      Sprawy niepilne → po 10:00 lub slack<br>
      Sprawy pilne → proszę wchodzić
    </div>
  </main>
</body>
</html>
